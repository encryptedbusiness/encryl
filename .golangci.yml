version: "2"

run:
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errorlint
    - misspell
    - unconvert
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # The spikes are throwaway kernel experiments, not shipped code. They use
      # syscall-level APIs deliberately and are gated by the kernel CI job.
      - linters:
          - errcheck
        path: internal/spike/
      - linters:
          - errcheck
        path: bench/loadgen/
    # The vendored liburing port mirrors upstream C and is not held to the
    # project's Go style rules.
    paths:
      - uring/giouring
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

# Note: gosec is deliberately not enabled yet. It flags the intentional
# unsafe.Pointer use in internal/ktls (the kernel crypto_info struct) and needs
# per-file tuning. Security coverage today comes from govulncheck, the
# threat-model review checklist, and the fuzz targets. Add gosec with a
# reviewed exclusion list rather than silencing it wholesale.
