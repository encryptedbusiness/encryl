name: security

on:
  push:
    branches: [v2, main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: dependency licenses
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./... --ignore github.com/encryptedbusiness/encryl/uring/giouring
      - name: vendored license present
        run: test -f uring/giouring/LICENSE

  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: encryl-sbom.spdx.json
